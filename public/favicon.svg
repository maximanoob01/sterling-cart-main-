<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E2E4B" />
      <stop offset="45%" stop-color="#731932" />
      <stop offset="100%" stop-color="#420B1B" />
    </linearGradient>

    <!-- Metallic Rim Shimmer -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.85" />
      <stop offset="35%" stop-color="#E2A6B7" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#8E2D48" stop-opacity="0.3" />
    </linearGradient>

    <!-- Diamond Silver Facet Gradients -->
    <linearGradient id="facetTable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#EDF2F7" />
    </linearGradient>

    <linearGradient id="facetTopLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <linearGradient id="facetTopRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="facetCenterLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="facetCenterRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <linearGradient id="facetBottomLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="100%" stop-color="#94A3B8" />
    </linearGradient>

    <linearGradient id="facetBottomRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Sparkle Radial Glow -->
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1" />
      <stop offset="40%" stop-color="#FED7E2" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FED7E2" stop-opacity="0" />
    </radialGradient>

    <!-- Subtle Drop Shadow for Diamond -->
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B040A" flood-opacity="0.65" />
    </filter>
  </defs>

  <!-- Luxury Squircle Badge -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Diamond Brilliant Emblem -->
  <g filter="url(#shadow)">
    <!-- Crown Facets (Top section) -->
    <!-- Table (Center top flat facet) -->
    <polygon points="190,140 322,140 354,196 158,196" fill="url(#facetTable)" />

    <!-- Top Left Corner -->
    <polygon points="120,196 158,196 190,140 148,154" fill="url(#facetTopLeft)" />

    <!-- Top Right Corner -->
    <polygon points="354,196 392,196 364,154 322,140" fill="url(#facetTopRight)" />

    <!-- Pavilion Center Facets (Upper triangle pointing down) -->
    <polygon points="158,196 354,196 256,380" fill="url(#facetCenterLeft)" opacity="0.95" />

    <!-- Center Facet Spine for 3D depth -->
    <polygon points="256,196 354,196 256,380" fill="url(#facetCenterRight)" opacity="0.45" />

    <!-- Pavilion Outer Left Triangle -->
    <polygon points="120,196 158,196 256,380" fill="url(#facetBottomLeft)" />

    <!-- Pavilion Outer Right Triangle -->
    <polygon points="354,196 392,196 256,380" fill="url(#facetBottomRight)" />

    <!-- Girdle Facet Accents (Light Highlights on edges) -->
    <line x1="120" y1="196" x2="392" y2="196" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" opacity="0.8" />
    <line x1="190" y1="140" x2="322" y2="140" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.9" />
  </g>

  <!-- Brilliant 4-Point Star Sparkle (Top-Right of Diamond) -->
  <g transform="translate(382, 136)">
    <!-- Glow halo -->
    <circle cx="0" cy="0" r="48" fill="url(#sparkleGlow)" opacity="0.85" />
    <!-- Vertical flare -->
    <path d="M 0 -44 Q 0 0 44 0 Q 0 0 0 44 Q 0 0 -44 0 Q 0 0 0 -44 Z" fill="#FFFFFF" />
    <!-- Central diamond glare -->
    <circle cx="0" cy="0" r="7" fill="#FFFFFF" />
  </g>

  <!-- Secondary subtle sparkle (Bottom-Left) -->
  <g transform="translate(138, 300) scale(0.48)">
    <circle cx="0" cy="0" r="32" fill="url(#sparkleGlow)" opacity="0.6" />
    <path d="M 0 -36 Q 0 0 36 0 Q 0 0 0 36 Q 0 0 -36 0 Q 0 0 0 -36 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>